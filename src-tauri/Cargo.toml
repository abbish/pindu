[package]
name = "pindu-app"
version = "0.1.0"
description = "拼读（Pindu.app）- 英语单词学习应用"
authors = ["RedLark"]
license = "MIT"
repository = "https://github.com/abbish/pindu"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "redlark_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate", "macros"], default-features = false }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
# 日志门面：拿不到 Logger 的代码与第三方库的日志经 log_bridge.rs 进应用日志
tracing = "0.1"
log = { version = "0.4", features = ["std"] }

sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
quick-xml = "0.38"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"

# 发布版只允许运行一个实例：新旧两个版本同时打开会同时升级同一个数据库
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# 应用内更新：检查 GitHub Releases 的 latest.json，下载后用内置公钥验签再安装
tauri-plugin-updater = "2"

# 发布构建：体积更小、运行更快（调试符号不随安装包分发）
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
