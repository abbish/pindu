[package]
name = "pindu-app"
version = "0.1.0"
description = "拼读（Pindu.app）- 英语单词学习应用"
authors = ["RedLark"]
license = "MIT"
repository = "https://github.com/abbish/pindu"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "redlark_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate", "macros"], default-features = false }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
thiserror = "2"
anyhow = "1.0"
# 0.13 默认改用 rustls + aws-lc；沿用系统 TLS（与 0.12 默认一致，证书走系统信任库）
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "native-tls", "charset", "http2", "system-proxy"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
# 日志门面：拿不到 Logger 的代码与第三方库的日志经 log_bridge.rs 进应用日志
tracing = "0.1"
log = { version = "0.4", features = ["std"] }

sha2 = "0.11"
base64 = "0.23"
# 本机发音评估（pronunciation/）与语音输入（dictation.rs）：ONNX Runtime 跑模型。不链接，运行时加载随应用分发的
# 微软官方库（scripts/onnxruntime/，1.23.2：最后一个有 Intel / 通用 Mac 版的版本，所以 API 用到 23），见 onnx_runtime.rs
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "tracing", "load-dynamic", "api-23"] }
encoding_rs = "0.8"
quick-xml = "0.42"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
# 局域网设备互传（lan/）：自签证书 + 双向 TLS（ring，与 reqwest 已用的 rustls 同一份）、组播发现、设备名
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
whoami = "1.6"

# 发布版只允许运行一个实例：新旧两个版本同时打开会同时升级同一个数据库
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# 应用内更新：检查 GitHub Releases 的 latest.json，下载后用内置公钥验签再安装
tauri-plugin-updater = "2"

# 发布构建：体积更小、运行更快（调试符号不随安装包分发）
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
