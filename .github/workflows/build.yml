name: Build

# 用一键构建脚本（scripts/package.mjs）在三个系统上各构建一次，验证用户本机构建的流程可用。
# 产物不签名，只作为 CI 附件下载（发布方式见 docs/BUILD.md：用户在自己的机器上构建）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential curl wget file pkg-config libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev

      - name: Check build environment
        run: node scripts/package.mjs --check

      - name: Build installers
        run: node scripts/package.mjs

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          path: release/
