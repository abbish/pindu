<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拼读 Pindu.app</title>
    <script>
      // 在任何样式与脚本加载之前定好主题（与 hooks/useTheme 同一规则），启动画面第一帧就是正确的颜色
      (function () {
        var p = 'system';
        try {
          p = localStorage.getItem('theme') || 'system';
        } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <!--
      启动画面（bootstrap）：前端代码加载之前就要画出来，所以样式写在这里，不放 styles/app.css。
      颜色与 app.css 的主题 token 一致；StartupGate 经 utils/bootSplash.ts 更新进度文字并在就绪后淡出移除。
      动画：品牌方块弹入 → 字母块 P·i·n·d·u 依次弹入 → 按音节合拢成 Pindu → 「拼读」与 .app 出现，约 1 秒播完。
    -->
    <style>
      :root {
        --boot-bg: #ffffff;
        --boot-fg: #18181b;
        --boot-muted: #63636b;
        --boot-tile: #f4f4f5;
        --boot-tile-border: #e4e4e7;
        --boot-brand: #0f766e;
        --boot-brand-fg: #ffffff;
        --boot-glow: rgba(15, 118, 110, 0.18);
      }
      :root[data-theme='dark'] {
        --boot-bg: #0b0b0d;
        --boot-fg: #f4f4f5;
        --boot-muted: #a1a1aa;
        --boot-tile: #1d1d21;
        --boot-tile-border: #2a2a30;
        --boot-brand: #4ecdc4;
        --boot-brand-fg: #062b28;
        --boot-glow: rgba(78, 205, 196, 0.22);
      }
      html,
      body {
        margin: 0;
        background: var(--boot-bg);
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: var(--boot-bg);
        color: var(--boot-fg);
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
        transition: opacity 360ms ease, transform 360ms ease;
      }
      #boot.boot-done {
        opacity: 0;
        transform: scale(1.015);
        pointer-events: none;
      }
      .boot-mark {
        position: relative;
        width: 72px;
        height: 72px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: var(--boot-brand);
        color: var(--boot-brand-fg);
        font-size: 38px;
        font-weight: 700;
        box-shadow: 0 0 0 0 var(--boot-glow);
        animation: boot-pop 460ms cubic-bezier(0.2, 0.9, 0.3, 1.3) both, boot-glow 2.4s ease-in-out 1s infinite;
      }
      .boot-word {
        display: flex;
        align-items: baseline;
        height: 48px;
      }
      .boot-han {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-right: 0;
        max-width: 0;
        overflow: hidden;
        white-space: nowrap;
        opacity: 0;
        animation: boot-han 280ms ease-out 0.72s forwards;
      }
      .boot-syllable {
        display: flex;
        gap: 8px;
        animation: boot-close-gap 260ms ease-in-out 0.62s forwards;
      }
      .boot-syllables {
        display: flex;
        align-items: baseline;
        gap: 18px;
        animation: boot-close-gap 260ms ease-in-out 0.62s forwards;
      }
      .boot-letter {
        display: inline-grid;
        place-items: center;
        min-width: 34px;
        height: 44px;
        border-radius: 10px;
        background: var(--boot-tile);
        box-shadow: inset 0 0 0 1px var(--boot-tile-border);
        font-size: 24px;
        font-weight: 600;
        line-height: 1;
        opacity: 0;
        animation:
          boot-letter 280ms cubic-bezier(0.2, 0.9, 0.3, 1.4) forwards,
          boot-blend 260ms ease-in-out 0.62s forwards;
      }
      .boot-letter:nth-child(1) { animation-delay: 0.15s, 0.62s; }
      .boot-letter:nth-child(2) { animation-delay: 0.21s, 0.62s; }
      .boot-letter:nth-child(3) { animation-delay: 0.27s, 0.62s; }
      .boot-syllable + .boot-syllable .boot-letter:nth-child(1) { animation-delay: 0.33s, 0.62s; }
      .boot-syllable + .boot-syllable .boot-letter:nth-child(2) { animation-delay: 0.39s, 0.62s; }
      .boot-suffix {
        font-size: 24px;
        font-weight: 500;
        color: var(--boot-muted);
        opacity: 0;
        transform: translateX(-4px);
        animation: boot-suffix 260ms ease-out 0.76s forwards;
      }
      .boot-progress {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        opacity: 0;
        animation: boot-fade 300ms ease-out 0.5s forwards;
      }
      .boot-bar {
        position: relative;
        width: 168px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: var(--boot-tile);
      }
      .boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: var(--boot-brand);
        animation: boot-indeterminate 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .boot-status {
        min-height: 18px;
        font-size: 13px;
        color: var(--boot-muted);
      }
      @keyframes boot-pop {
        from { opacity: 0; transform: scale(0.6) rotate(-8deg); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-glow {
        0%, 100% { box-shadow: 0 0 0 0 var(--boot-glow); }
        50% { box-shadow: 0 0 0 14px transparent, 0 0 32px 6px var(--boot-glow); }
      }
      @keyframes boot-letter {
        from { opacity: 0; transform: translateY(14px) scale(0.6); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-blend {
        to { background: transparent; box-shadow: inset 0 0 0 1px transparent; min-width: 0; }
      }
      @keyframes boot-close-gap {
        to { gap: 0; }
      }
      @keyframes boot-han {
        to { opacity: 1; max-width: 3em; margin-right: 12px; }
      }
      @keyframes boot-suffix {
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-fade {
        to { opacity: 1; }
      }
      @keyframes boot-indeterminate {
        from { transform: translateX(-110%); }
        to { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot *,
        #boot *::after {
          animation-duration: 1ms !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-mark" aria-hidden="true">拼</div>
      <div class="boot-word" aria-label="拼读 Pindu.app">
        <span class="boot-han" aria-hidden="true">拼读</span>
        <span class="boot-syllables" aria-hidden="true">
          <span class="boot-syllable"><span class="boot-letter">P</span><span class="boot-letter">i</span><span class="boot-letter">n</span></span>
          <span class="boot-syllable"><span class="boot-letter">d</span><span class="boot-letter">u</span></span>
        </span>
        <span class="boot-suffix" aria-hidden="true">.app</span>
      </div>
      <div class="boot-progress">
        <div class="boot-bar"></div>
        <div class="boot-status" id="boot-status">正在启动…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
